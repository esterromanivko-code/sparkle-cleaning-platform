# Netlify builds the site with scripts/build-site.js, which copies an approved list of
# public files into dist/. Only dist/ is published — never the repository itself.
# (Publishing "." put the backend's source code and internal documents on the
# public internet.) To publish a new page, add it to PUBLIC_FILES in that script.
[build]
  command = "node scripts/build-site.js"
  publish = "dist"

# ── Security headers on every response ───────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

# Serve sparkle_full.html at /app for a cleaner URL
[[redirects]]
  from = "/app"
  to = "/sparkle_full.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/sparkle_blog.html"
  status = 200

# Legal pages
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/accessibility"
  to = "/accessibility.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/sparkle_landing.html"
  status = 200
